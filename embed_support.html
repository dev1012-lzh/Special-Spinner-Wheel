<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Premium Pale Spinner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f5;
            --hub: #222;
            --ptr: #333;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        #ui-layer {
            text-align: center;
            margin-bottom: 20px;
            z-index: 20;
        }

        #result-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #444;
            margin: 0;
            min-height: 1.2em;
        }

        #wheel-wrapper {
            position: relative;
            width: 85vmin; height: 85vmin;
            max-width: 500px; max-height: 500px;
            display: flex; align-items: center; justify-content: center;
        }

        canvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }

        .pointer-tri {
            position: absolute;
            top: 25%; 
            left: 50%;
            width: 50px; height: 50px;
            background: var(--ptr);
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            transform: translateX(-50%);
            z-index: 15;
        }
        
        .center-hub {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            background: var(--hub);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 16;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button {
            margin-top: 30px;
            padding: 14px 60px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background: var(--hub);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button:hover { transform: scale(1.05); background: #444; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #bbb; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <p id="result-text">Ready?</p>
    </div>

    <div id="wheel-wrapper">
        <div class="pointer-tri"></div>
        <div class="center-hub"></div>
        <canvas id="wheel" width="1000" height="1000"></canvas>
    </div>

    <button id="spinBtn">SPIN WHEEL</button>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('spinBtn');
        const resText = document.getElementById('result-text');

        const totalSlices = 39;
        const sliceAngle = (Math.PI * 2) / totalSlices;
        const prankSequence = [1, 3, 5, 7, 9];
        let prankIndex = 0;

        // Audio Context for Ticks
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTick(vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function draw(rotation = 0) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 15;
            const palette = ['#ffffff', '#ececec', '#c0c0c0'];

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotation);

            for (let i = 0; i < totalSlices; i++) {
                ctx.beginPath();
                ctx.fillStyle = palette[i % 3];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fill();
                
                ctx.strokeStyle = "rgba(255,255,255,1)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.fillStyle = "#333";
                ctx.font = "600 30px Poppins";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillText(i + 1, radius - 60, 0);
                ctx.restore();
            }
            ctx.restore();
        }

        // 1 starts at top. Offset = -90deg - half slice
        let currentRotation = -Math.PI / 2 - (sliceAngle / 2);
        draw(currentRotation);

        btn.addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            btn.disabled = true;
            resText.innerText = "Spinning...";
            
            const targetNum = prankIndex < prankSequence.length ? prankSequence[prankIndex++] : Math.floor(Math.random() * 39) + 1;
            
            const extraSpins = (8 + Math.random() * 2) * Math.PI * 2; 
            const targetSliceIndex = targetNum - 1;
            const finalLandingAngle = -(targetSliceIndex * sliceAngle) - (sliceAngle / 2) - (Math.PI / 2);
            
            const startAngle = currentRotation;
            const endAngle = startAngle + extraSpins + (finalLandingAngle - (startAngle % (Math.PI * 2)));
            
            const duration = 5000;
            const startTime = performance.now();
            let lastTickAngle = startAngle;

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                
                // Quartic Ease Out (Faster start, very long smooth finish)
                const ease = 1 - Math.pow(1 - t, 4);
                currentRotation = startAngle + (endAngle - startAngle) * ease;
                
                // Sound logic: Play tick every time a new slice passes the top
                if (Math.abs(currentRotation - lastTickAngle) >= sliceAngle) {
                    const velocity = 1 - t; // Volume and pitch drop as it slows
                    playTick(0.1 * velocity + 0.02);
                    lastTickAngle = currentRotation;
                }

                draw(currentRotation);

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    btn.disabled = false;
                    resText.innerText = "Landed on: " + targetNum;
                    currentRotation %= (Math.PI * 2);
                }
            }
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
