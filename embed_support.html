<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pale Spinner - Hum Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f5;
            --hub: #222;
            --ptr: #333;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        #result-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 20px;
            min-height: 1.2em;
        }

        #wheel-wrapper {
            position: relative;
            width: 85vmin; height: 85vmin;
            max-width: 500px; max-height: 500px;
        }

        canvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }

        .pointer-tri {
            position: absolute;
            top: 22%; 
            left: 50%;
            width: 50px; height: 55px;
            background: var(--ptr);
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            transform: translateX(-50%);
            z-index: 15;
        }
        
        .center-hub {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            background: var(--hub);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 16;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button {
            margin-top: 30px;
            padding: 14px 60px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background: var(--hub);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        button:hover { background: #444; transform: translateY(-2px); }
        button:disabled { background: #bbb; cursor: not-allowed; }
    </style>
</head>
<body>

    <p id="result-text">Landed on: -</p>

    <div id="wheel-wrapper">
        <div class="pointer-tri"></div>
        <div class="center-hub"></div>
        <canvas id="wheel" width="1000" height="1000"></canvas>
    </div>

    <button id="spinBtn">SPIN WHEEL</button>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('spinBtn');
        const resText = document.getElementById('result-text');

        const totalSlices = 39;
        const sliceAngle = (Math.PI * 2) / totalSlices;
        const prankSequence = [1, 3, 5, 7, 9];
        let prankIndex = 0;

        // Audio Setup: Mid-range Hum
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let humOsc = null;
        let humGain = null;

        function startHum() {
            humOsc = audioCtx.createOscillator();
            humGain = audioCtx.createGain();
            humOsc.type = 'triangle'; 
            humOsc.frequency.setValueAtTime(330, audioCtx.currentTime); // Mid-range E4
            humGain.gain.setValueAtTime(0, audioCtx.currentTime);
            humOsc.connect(humGain);
            humGain.connect(audioCtx.destination);
            humOsc.start();
        }

        function updateHum(velocity) {
            if (!humOsc) return;
            // Pitch shifts slightly with speed
            humOsc.frequency.setTargetAtTime(220 + (velocity * 220), audioCtx.currentTime, 0.05);
            // Volume tied to velocity
            humGain.gain.setTargetAtTime(velocity * 0.15, audioCtx.currentTime, 0.05);
        }

        function stopHum() {
            if (humGain) humGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            setTimeout(() => { if(humOsc) humOsc.stop(); }, 200);
        }

        function draw(rotation = 0) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 15;
            const palette = ['#ffffff', '#ececec', '#c0c0c0'];

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotation);

            for (let i = 0; i < totalSlices; i++) {
                ctx.beginPath();
                ctx.fillStyle = palette[i % 3];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.05)";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.fillStyle = "#333";
                ctx.font = "600 28px Poppins";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillText(i + 1, radius - 55, 0);
                ctx.restore();
            }
            ctx.restore();
        }

        let currentRotation = -Math.PI / 2 - (sliceAngle / 2);
        draw(currentRotation);

        btn.addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            btn.disabled = true;
            resText.innerText = "Spinning...";
            startHum();
            
            const targetNum = prankIndex < prankSequence.length ? prankSequence[prankIndex++] : Math.floor(Math.random() * 39) + 1;
            
            const extraSpins = (7 + Math.random() * 2) * Math.PI * 2; 
            
            // RANDOM OFFSET: Land slightly off-center for realism
            // Slices are ~9.2 degrees. We offset by up to +/- 3.5 degrees
            const randomPadding = (Math.random() - 0.5) * (sliceAngle * 0.7);
            
            const targetSliceIndex = targetNum - 1;
            const finalLandingAngle = -(targetSliceIndex * sliceAngle) - (sliceAngle / 2) - (Math.PI / 2) + randomPadding;
            
            const startAngle = currentRotation;
            const endAngle = startAngle + extraSpins + (finalLandingAngle - (startAngle % (Math.PI * 2)));
            
            const duration = 6000;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                
                const ease = 1 - Math.pow(1 - t, 4);
                const velocity = Math.pow(1 - t, 2); // Simulated slowing down
                
                currentRotation = startAngle + (endAngle - startAngle) * ease;
                updateHum(velocity);
                draw(currentRotation);

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    stopHum();
                    btn.disabled = false;
                    resText.innerText = "Landed on: " + targetNum;
                    currentRotation %= (Math.PI * 2);
                }
            }
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
