<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>High-Stakes Dramatic Scroller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,457&display=swap"
        rel="stylesheet">

    <style>
        .google-sans-flex-457 {
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;

            font-style: normal;
            font-variation-settings:
                "slnt" 0,
                "wdth" 100,
                "GRAD" 0,
                "ROND" 0;
        }

        :root {
            --bg: #f0f2f2;
            --accent: #3f536e;
            --slot-w: 100px;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            
            font-family: 'Google Sans Flex', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #result-banner {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        #viewport {
            position: relative;
            width: 320px;
            height: 120px;
            background: #fff;
            border-radius: 20px;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 6px solid #fff;
        }

        #strip {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }

        .slot {
            min-width: var(--slot-w);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #333;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .c1 {
            background: #ecfaff;
        }

        .c2 {
            background: #c1d0dd;
        }

        .c3 {
            background: #c1e1eb;
        }

        #pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #47bbff;
            transform: translateX(-50%);
            z-index: 10;
            opacity: 0.5;
        }

        #pointer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 14px solid #47bbff;


        }

        button {
            font-family: "Google Sans Flex", sans-serif;
            margin-top: 40px;
            padding: 16px 60px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(68, 108, 168, 0.747);
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            color: var(--accent);
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(68, 108, 168, 0.747);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        div.foot {
            position: absolute;
            bottom: 10px;
            font-size: 17px;
            color: #b1b0b0;
        }

        /* Animated background orbs */
        .bg-visuals {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #e0e5ec5d;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 3s infinite alternate ease-in-out;
        }

        .orb-1 {
            background: #7dc4d1;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            background: #a7fcbc;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .orb-3 {
            background: #f1d9ad;
            top: 20%;
            right: 20%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 50px) scale(2);
            }
        }

        /* Glassmorphism Viewport */
        #viewport {
            position: relative;
            width: 320px;
            height: 120px;
            /* Frosted Glass Effect */
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            overflow: hidden;
        }

        /* Make numbers pop against glass */
        .slot {
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.185);
        }
    </style>
</head>

<body>
    <div class="bg-visuals">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="result-banner">Who's gonna be the lucky one? </div>

    <div id="viewport">
        <div id="pointer"></div>
        <div id="strip"></div>
    </div>

    <button id="spinBtn">ROLL NUMBERS</button>

    <div class="foot">
        <p>Made by lzh with <span style="font-size:35px;">👻</span></p>
    </div>

    <script>
        const strip = document.getElementById('strip');
        const btn = document.getElementById('spinBtn');
        const banner = document.getElementById('result-banner');

        const slotW = 100;
        const totalSlots = 500;
        const targetStopIndex = 480;
        const prankSequence = [16, 10, 8, 27, 3, 30];
        let prankIndex = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playWhistle(pitchMod) {
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';

            const freq = 800 - (pitchMod * -900);
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.03, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(t + 0.12);
        }

        function buildStrip(targetNum) {
            const colors = ['c1', 'c2', 'c3'];
            let html = '';
            for (let i = 0; i < totalSlots; i++) {
                let displayVal;
                if (i === targetStopIndex) {
                    displayVal = targetNum;
                } else if (i === targetStopIndex - 5) {
                    displayVal = targetNum === 1 ? 38 : targetNum - 5;
                } else if (i === targetStopIndex - 4) {
                    displayVal = targetNum === 1 ? 38 : targetNum - 4;
                } else if (i === targetStopIndex - 3) {
                    displayVal = targetNum === 1 ? 38 : targetNum - 3;
                } else if (i === targetStopIndex - 2) {
                    displayVal = targetNum === 1 ? 38 : targetNum - 2;
                } else if (i === targetStopIndex - 1) {
                    displayVal = targetNum === 1 ? 39 : targetNum - 1;
                } else if (i === targetStopIndex + 1) {
                    displayVal = targetNum === 39 ? 1 : targetNum + 1;
                } else {
                    displayVal = Math.floor(Math.random() * 39) + 1;
                }
                html += `<div class="slot ${colors[i % 3]}">${displayVal}</div>`;
            }
            strip.innerHTML = html;
        }

        const finalMessages = [
            targetNum => `That's you. Number ${targetNum}.`,
            targetNum => `Nice to meet you. Number ${targetNum}.`,
            targetNum => `You. ${targetNum} is the lucky number today.`,
            targetNum => `Hi, ${targetNum}.`,
            targetNum => `That's you. Number ${targetNum}.`,
        ];
        let finalTextIndex = 0;

        btn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            btn.disabled = true;
            const rollingTexts = [
                "Spinning...",
                "It might be...",
                "Momentum is building...",
                "Luck is turning to..."
            ];
            let rollingTextIndex = Math.floor(Math.random() * rollingTexts.length);
            banner.innerText = rollingTexts[rollingTextIndex];


            const targetNum = prankSequence[prankIndex++] || Math.floor(Math.random() * 39) + 1;
            buildStrip(targetNum);

            strip.style.transform = `translateX(0px)`;
            strip.offsetHeight;

            // Center math
            const finalX = -(targetStopIndex * slotW) + (320 / 2) - (slotW / 2);

            const duration = 8000;
            const startTime = performance.now();
            let lastTick = 0;

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);


                let ease = 1 - Math.pow(1 - t, 6);


                let shudder = 0;
                if (t > 0.9 && t < 0.99) {
                    shudder = Math.sin(now * 0.5) * (1 - t) * 5;
                }

                let currentX = (ease * finalX) + shudder;

                strip.style.transform = `translateX(${currentX}px)`;

                if (Math.abs(currentX - lastTick) >= slotW) {
                    playWhistle(t);
                    lastTick = currentX;
                }

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {

                    strip.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    strip.style.transform = `translateX(${finalX}px)`;

                    setTimeout(() => {
                        btn.disabled = false;
                        banner.innerText = finalMessages[finalTextIndex](targetNum);
                        finalTextIndex = (finalTextIndex + 1) % finalMessages.length;
                    }, 500);

                    // Add a flash/shimmer effect to the glass on landing
                    viewport.style.transition = 'background 0.3s';
                    viewport.style.background = 'rgba(255, 255, 255, 0.5)';
                    setTimeout(() => {
                        viewport.style.background = 'rgba(255, 255, 255, 0.2)';
                    }, 300);
                }
            }
            requestAnimationFrame(animate);
        });
    </script>
</body>

</html>
