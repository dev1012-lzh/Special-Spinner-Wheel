<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calibrated Scroller +150</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f2;
            --accent: #222;
            --slot-w: 100px; 
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        #result-banner {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        #viewport {
            position: relative;
            width: 320px; 
            height: 120px;
            background: #fff;
            border-radius: 20px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1), 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 6px solid #fff;
        }

        #strip {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }

        .slot {
            min-width: var(--slot-w);
            height: 100%;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 2.8rem; color: #333;
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        .c1 { background: #ffffff; }
        .c2 { background: #e8e8e8; }
        .c3 { background: #b8b8b8; }

        #pointer {
            position: absolute;
            left: 50%; top: 0; bottom: 0;
            width: 4px; background: #ff4757;
            transform: translateX(-50%);
            z-index: 10;
        }

        #pointer::before {
            content: '';
            position: absolute; top: 0; left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 14px solid #ff4757;
        }

        button {
            margin-top: 40px;
            padding: 16px 60px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        button:hover { transform: scale(1.05); background: #000; }
        button:disabled { background: #999; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="result-banner">Landed on: -</div>

    <div id="viewport">
        <div id="pointer"></div>
        <div id="strip"></div>
    </div>

    <button id="spinBtn">ROLL NUMBERS</button>

    <script>
        const strip = document.getElementById('strip');
        const btn = document.getElementById('spinBtn');
        const banner = document.getElementById('result-banner');
        
        const totalNums = 39;
        const slotW = 100;
        const prankSequence = [1, 3, 5, 7, 9];
        let prankIndex = 0;

        function initStrip() {
            const classes = ['c1', 'c2', 'c3'];
            let html = '';
            // 30 repeats to handle a long 10-second roll
            for (let r = 0; r < 30; r++) { 
                for (let i = 1; i <= totalNums; i++) {
                    html += `<div class="slot ${classes[i % 3]}">${i}</div>`;
                }
            }
            strip.innerHTML = html;
        }
        initStrip();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playWhistle(pitchMod) {
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const freq = 450 - (pitchMod * 300); 
            osc.frequency.setValueAtTime(freq, t);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.7, t + 0.1);
            gain.gain.setValueAtTime(0.04, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(t + 0.12);
        }

        btn.addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            btn.disabled = true;
            banner.innerText = "Rolling...";

            const targetNum = prankIndex < prankSequence.length ? prankSequence[prankIndex++] : Math.floor(Math.random() * 39) + 1;
            
            // POSITIVE CALIBRATION: +150px to shift strip right
            const calibrationOffset = 1.5 * slotW; 
            const centerOfViewport = 160; 
            
            // Rolling deep into the strip for drama
            const targetSetBase = 22 * totalNums;
            const targetIndex = targetSetBase + (targetNum - 1);
            
            // Added slight jitter so it doesn't land perfectly robotic
            const randJitter = (Math.random() - 0.5) * 40;
            
            const finalX = -(targetIndex * slotW) + centerOfViewport - (slotW / 2) + calibrationOffset + randJitter;
            
            const duration = 10000; // 10 seconds
            const startTime = performance.now();
            let lastTick = 0;

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                
                // quintic ease-out for a long, heavy "mechanical" drag finish
                const ease = 1 - Math.pow(1 - t, 5);
                const currentX = ease * finalX;
                
                strip.style.transform = `translateX(${currentX}px)`;

                if (Math.abs(currentX - lastTick) >= slotW) {
                    playWhistle(t);
                    lastTick = currentX;
                }

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    btn.disabled = false;
                    banner.innerText = "Landed on: " + targetNum;
                }
            }
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
