<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizontal Slot Scroller</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f2;
            --accent: #333;
            --card-w: 80px; /* Width of one number slot */
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        #display-text {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 20px;
            height: 1.5em;
        }

        /* The Viewport (Window) */
        #scroller-window {
            position: relative;
            width: 300px; /* Show about 3.5 numbers */
            height: 100px;
            background: #fff;
            border: 4px solid #fff;
            border-radius: 15px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* The moving track */
        #strip {
            display: flex;
            position: absolute;
            left: 0;
            will-change: transform;
        }

        .num-slot {
            min-width: var(--card-w);
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #333;
            border-right: 1px solid #eee;
        }

        /* Palette from your images */
        .pale-1 { background: #ffffff; }
        .pale-2 { background: #e8e8e8; }
        .pale-3 { background: #b8b8b8; }

        /* The Center Marker (Pointer) */
        #marker {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #ff4757;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        #marker::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid #ff4757;
        }

        button {
            margin-top: 40px;
            padding: 15px 50px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-family: 'Poppins';
            transition: 0.2s;
        }

        button:hover { transform: scale(1.05); background: #000; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="display-text">Ready?</div>

    <div id="scroller-window">
        <div id="marker"></div>
        <div id="strip"></div>
    </div>

    <button id="spinBtn">ROLL NUMBERS</button>

    <script>
        const strip = document.getElementById('strip');
        const btn = document.getElementById('spinBtn');
        const resText = document.getElementById('display-text');
        
        const totalNums = 39;
        const slotWidth = 80;
        const prankSequence = [1, 3, 5, 7, 9];
        let prankIndex = 0;

        // Build the horizontal strip (repeated a few times for infinite feel)
        function createStrip() {
            const palette = ['pale-1', 'pale-2', 'pale-3'];
            let content = '';
            // Generate 3 sets of 1-39 to allow for long scrolling
            for (let r = 0; r < 5; r++) {
                for (let i = 1; i <= totalNums; i++) {
                    content += `<div class="num-slot ${palette[i % 3]}">${i}</div>`;
                }
            }
            strip.innerHTML = content;
        }
        createStrip();

        // Audio: Funny Slide Whistle
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSlideSound(progress) {
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            // Starts high, slides lower as progress increases
            const freq = 600 - (progress * 400);
            osc.frequency.setValueAtTime(freq, t);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.8, t + 0.1);
            
            gain.gain.setValueAtTime(0.05, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(t + 0.1);
        }

        let currentPos = 0;

        btn.addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            btn.disabled = true;
            resText.innerText = "Rolling...";

            const targetNum = prankIndex < prankSequence.length ? prankSequence[prankIndex++] : Math.floor(Math.random() * 39) + 1;
            
            // Calculate Position
            // We want targetNum to be at center of the window
            const windowCenter = 300 / 2;
            const targetIndexInLastSet = (3 * totalNums) + (targetNum - 1);
            
            // Random offset within the slot (-30 to +30 pixels)
            const randomOffset = (Math.random() - 0.5) * 50;
            
            const finalPos = -(targetIndexInLastSet * slotWidth) + windowCenter - (slotWidth / 2) + randomOffset;
            
            const duration = 5000;
            const startTime = performance.now();
            let lastTickPos = 0;

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                
                // Elastic/Heavy ease out
                const ease = 1 - Math.pow(1 - t, 4);
                const pos = ease * finalPos;
                
                strip.style.transform = `translateX(${pos}px)`;

                // Play sound every time a new number passes center
                if (Math.abs(pos - lastTickPos) >= slotWidth) {
                    playSlideSound(t);
                    lastTickPos = pos;
                }

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    btn.disabled = false;
                    resText.innerText = "Landed on: " + targetNum;
                    // Reset position internally if it gets too high (optional)
                }
            }
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
