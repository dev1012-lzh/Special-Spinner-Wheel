<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pale Spinner 1-39</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pale: #f8f9fa;
            --text-dark: #444;
            /* Colors sampled from your image */
            --color-white: #ffffff;
            --color-light-grey: #dcdcdc;
            --color-mid-grey: #a9a9a9;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-pale);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            max-width: 450px;
            max-height: 450px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* The Pointer from your image */
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 60px;
            background: #333;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: translate(-50%, -110%) rotate(180deg);
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
        }
        
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #222;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
        }

        button {
            margin-top: 30px;
            padding: 12px 40px;
            cursor: pointer;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #333;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        button:hover { transform: scale(1.05); background: #eee; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #result-display {
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            height: 2rem;
        }
    </style>
</head>
<body>

    <div id="result-display"></div>

    <div id="container">
        <div class="pointer"></div>
        <div class="center-hub"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
    </div>

    <button id="spinBtn">SPIN</button>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('spinBtn');
        const resDisp = document.getElementById('result-display');

        const totalSlices = 39;
        const sliceAngle = (Math.PI * 2) / totalSlices;
        const prankSequence = [1, 3, 5, 7, 9];
        let prankIndex = 0;

        // Pale theme colors
        const palette = ['#ffffff', '#e0e0e0', '#b0b0b0'];

        function draw(rotation = 0) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotation);

            for (let i = 0; i < totalSlices; i++) {
                ctx.beginPath();
                ctx.fillStyle = palette[i % 3];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Numbers
                ctx.save();
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.fillStyle = "#333";
                ctx.font = "bold 24px Poppins";
                ctx.textAlign = "right";
                // Text is shifted slightly to look centered in the pale slices
                ctx.fillText(i + 1, radius - 40, 10);
                ctx.restore();
            }
            ctx.restore();
        }

        let currentRotation = -Math.PI / 2; // Start with 1 at top
        draw(currentRotation);

        btn.addEventListener('click', () => {
            btn.disabled = true;
            resDisp.innerText = "";
            
            // Get target from prank list or random
            const targetNum = prankIndex < prankSequence.length ? prankSequence[prankIndex++] : Math.floor(Math.random() * 39) + 1;
            
            // Calculate final angle to land on targetNum at the TOP
            const extraSpins = 5 * Math.PI * 2;
            const targetSliceIndex = targetNum - 1;
            const targetAngle = -(targetSliceIndex * sliceAngle) - (sliceAngle / 2) - (Math.PI / 2);
            
            const startAngle = currentRotation;
            const endAngle = startAngle + extraSpins + (targetAngle - (startAngle % (Math.PI * 2)));
            
            const duration = 4000;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                
                // Ease out cubic
                const easeOut = 1 - Math.pow(1 - t, 3);
                currentRotation = startAngle + (endAngle - startAngle) * easeOut;
                
                draw(currentRotation);

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    btn.disabled = false;
                    resDisp.innerText = "Landed on: " + targetNum;
                }
            }
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
